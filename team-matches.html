<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Matches</title>
    <style>
        body {
            background-color: rgb(20, 20, 20);
            color: rgb(232, 231, 231);
            font-family: sans-serif;
            margin: 0;
            padding: 24px;
        }

        main {
            margin: 0 auto;
            max-width: 900px;
        }

        .header {
            align-items: center;
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .team-logo {
            height: 64px;
            object-fit: contain;
            width: 64px;
        }

        .back-link {
            color: rgb(232, 231, 231);
            margin-left: auto;
        }

        .matches-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .matches-section {
            background-color: rgb(35, 35, 35);
            border-radius: 6px;
            padding: 28px;
        }

        .matches-section h2 {
            font-size: 24px;
            margin-top: 0;
        }

        .refresh-reminder {
            color: rgb(170, 170, 170);
            font-size: 13px;
            line-height: 1.4;
            margin: -12px 0 20px;
        }

        .match-list {
            display: grid;
            gap: 16px;
            grid-template-columns: 1fr;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .match-item {
            border-top: 1px solid rgb(70, 70, 70);
            min-width: 0;
            padding: 20px 0 8px;
            text-align: center;
        }

        .match-date,
        .match-league,
        .empty-state,
        .loading-state,
        .error-state {
            color: rgb(170, 170, 170);
            font-size: 17px;
        }

        .match-teams {
            align-items: center;
            display: flex;
            font-size: 25px;
            font-weight: bold;
            gap: 14px;
            justify-content: center;
            line-height: 1.3;
            margin: 12px 0;
            text-align: center;
        }

        .match-score {
            font-size: 22px;
            white-space: nowrap;
        }

        .match-league {
            font-size: 17px;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .matches-section {
                padding: 20px;
            }

            .match-teams {
                font-size: 19px;
                gap: 8px;
            }

            .match-score {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <main>
        <header class="header">
            <img class="team-logo" id="team-logo" alt="">
            <h1 id="team-name">Team Matches</h1>
            <a class="back-link" href="saved-teams.html">Saved teams</a>
        </header>
        <div class="matches-grid">
            <section class="matches-section">
                <h2>Next match</h2>
                <p class="refresh-reminder">Match results refresh automatically every 8–9 hours. If this team has not been checked yet, opening this page starts its first check.</p>
                <ul class="match-list" id="upcoming-matches"></ul>
            </section>
        </div>
    </main>
    <script src="team-matches.js"></script>
</body>
</html>
