<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Match Lineup</title>
    <style>
        body {
            background: rgb(20, 20, 20);
            color: rgb(232, 231, 231);
            font-family: sans-serif;
            margin: 0;
            padding: 24px;
        }

        main {
            margin: 0 auto;
            max-width: 900px;
        }

        header {
            align-items: center;
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .back-link {
            color: rgb(232, 231, 231);
            margin-left: auto;
        }

        .lineups {
            display: grid;
            gap: 24px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .lineup {
            background: rgb(35, 35, 35);
            border-radius: 6px;
            padding: 24px;
        }

        .lineup h2 {
            margin-top: 0;
        }

        .formation {
            color: rgb(170, 170, 170);
            font-size: 14px;
        }

        .player-group h3 {
            border-bottom: 2px solid rgb(180, 100, 140);
            font-size: 16px;
            margin: 24px 0 0;
            padding-bottom: 8px;
        }

        .players {
            list-style: none;
            margin: 16px 0 0;
            padding: 0;
        }

        .player {
            border-top: 1px solid rgb(70, 70, 70);
            padding: 10px 0;
        }

        .role {
            color: rgb(170, 170, 170);
            font-size: 13px;
            margin-left: 6px;
        }

        .message {
            color: rgb(170, 170, 170);
        }

        .reminder-popup {
            background: rgb(98, 25, 57);
            border: 1px solid rgb(220, 150, 180);
            border-radius: 8px;
            box-shadow: 0 10px 30px rgb(0 0 0 / 45%);
            left: 50%;
            padding: 20px 48px 20px 20px;
            position: fixed;
            top: 24px;
            transform: translateX(-50%);
            width: min(520px, calc(100% - 48px));
            z-index: 10;
        }

        .reminder-popup p {
            margin: 0;
        }

        .close-reminder {
            background: transparent;
            border: 0;
            color: rgb(232, 231, 231);
            cursor: pointer;
            font-size: 24px;
            line-height: 1;
            padding: 4px;
            position: absolute;
            right: 12px;
            top: 12px;
        }

        @media (max-width: 650px) {
            .lineups {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1 id="match-title">Match Lineup</h1>
            <a class="back-link" href="saved-teams.html">Saved teams</a>
        </header>
        <p class="message" id="status"></p>
        <div class="lineups" id="lineups"></div>
    </main>
    <aside class="reminder-popup" id="reminder-popup" role="alert" hidden>
        <button class="close-reminder" id="close-reminder" type="button" aria-label="Close reminder">&times;</button>
        <p id="reminder-message">Lineups are announced.</p>
    </aside>
    <script src="api-config.js"></script>
    <script src="event-details.js"></script>
</body>
</html>
